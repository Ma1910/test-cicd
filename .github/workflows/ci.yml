name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # 1. Quality & Security Gate
  # =========================================================================
  quality-gate:
    name: Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Linter & Syntax Check
        id: lint
        run: npm run lint

      - name: 🔍 TypeScript Strict Typecheck
        id: typecheck
        run: npm run typecheck

      - name: 🧪 Run Vitest & Verify Coverage Gate (>80%)
        id: test
        run: npm run test:coverage

      - name: 🛡️ Trivy Secret Scanning (No Leaks)
        id: secret
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: 📦 Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-report
          path: coverage/
          retention-days: 7

      - name: 📊 Render CI Quality Report to GitHub Web
        if: always()
        run: |
          echo "## 🛡️ CI Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check Name | Command | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linter & Syntax** | \`npm run lint\` | ${{ steps.lint.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Strict Typecheck** | \`npm run typecheck\` | ${{ steps.typecheck.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vitest Suite & Coverage** | \`npm run test:coverage\` | ${{ steps.test.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy Secret Scan** | \`trivy fs --scanners secret\` | ${{ steps.secret.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` by @${{ github.actor }} on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # 2. Build & Push Hardened Docker Image
  # =========================================================================
  docker-build-push:
    name: Docker Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=branch

      - name: 🏗️ Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. Production Deployment with Automated Health Verification & Rollback
  # =========================================================================
  deploy-production:
    name: Production Deployment & Verification
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ secrets.PROD_DOMAIN || 'localhost:3000' }}
    steps:
      - name: 🚀 Deploy to Target Server via SSH
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_USER: ${{ secrets.PROD_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          IMAGE_URI: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "⚠️ Production server secrets (PROD_HOST, PROD_SSH_KEY) not configured yet."
            echo "💡 Configure them in GitHub Settings -> Secrets -> Actions to enable remote push."
            echo "✅ Docker image ${{ env.IMAGE_URI }} has been published successfully to GHCR."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            cd /opt/app || mkdir -p /opt/app && cd /opt/app
            docker pull $IMAGE_URI

            OLD_CONTAINER=\$(docker ps -q -f name=cicd-app-prod || true)
            if [ -n \"\$OLD_CONTAINER\" ]; then
              docker commit \"\$OLD_CONTAINER\" cicd-app-previous:rollback || true
            fi

            DOCKER_IMAGE=$IMAGE_URI docker compose -f docker-compose.prod.yml up -d --remove-orphans

            HEALTHY=false
            for i in {1..10}; do
              if curl -s -f http://localhost:3000/healthz | grep -q '\"status\":\"UP\"'; then
                echo \"✅ Healthcheck passed! Service is UP.\"
                HEALTHY=true
                break
              fi
              sleep 3
            done

            if [ \"\$HEALTHY\" = false ]; then
              echo '🚨 Healthcheck FAILED! Reverting to rollback image...'
              if docker image inspect cicd-app-previous:rollback >/dev/null 2>&1; then
                DOCKER_IMAGE=cicd-app-previous:rollback docker compose -f docker-compose.prod.yml up -d
              fi
              exit 1
            fi
            docker image prune -f
          "

      - name: 📊 Render Deployment Summary to GitHub Web
        if: always()
        run: |
          echo "## 🚢 Production Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`production\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ SUCCESSFUL' || '❌ FAILED / ROLLED BACK' }} |" >> $GITHUB_STEP_SUMMARY
