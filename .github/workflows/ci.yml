name: CI/CD Pipeline (Visual Flowchart)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # ========================================================
  # Nút 1: Code Quality & Type Check
  # ========================================================
  code-quality:
    name: 1. Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript Check
        run: npm run typecheck

  # ========================================================
  # Nút 2a: Automated Unit Tests (Chạy sau bước 1)
  # ========================================================
  unit-tests:
    name: 2a. Automated Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run Vitest
        run: npm test

  # ========================================================
  # Nút 2b: Security Audit (Chạy song song với Nút 2a)
  # ========================================================
  security-scan:
    name: 2b. Security Audit
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🛡️ Audit dependencies
        run: npm audit --audit-level=high

  # ========================================================
  # Nút 3: Docker Build (Chờ cả 2a và 2b pass mới chạy)
  # ========================================================
  docker-build:
    name: 3. Docker Multi-stage Build
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: test-cicd:latest

  # ========================================================
  # Nút 4: Deploy Gateway (Đỉnh cuối của đồ thị nối dây)
  # ========================================================
  deploy-gateway:
    name: 4. Production Deployment
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: 🚀 Verify Deployment Ready
        run: |
          echo "🎉 Toàn bộ quy trình kiểm tra đã hoàn thành mỹ mãn!"
          echo "🌐 Mã nguồn đã sẵn sàng triển khai lên Production!"
