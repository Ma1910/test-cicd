name: CI - Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Static Type Check
        run: npm run typecheck

      - name: 🧪 Run Automated Tests
        run: npm test

      - name: 🏗️ Verify Production Build
        run: npm run build

      - name: 📊 Write Job Summary
        if: always()
        run: |
          echo "### 🚀 CI Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Kiểm tra | Kết quả |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ✅ Hoàn thành |" >> $GITHUB_STEP_SUMMARY
          echo "| Automated Unit & API Tests | ✅ Đã vượt qua |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Build | ✅ Thành công |" >> $GITHUB_STEP_SUMMARY
